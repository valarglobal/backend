version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: valarpay-db
    environment:
      POSTGRES_DB: valarpay
      POSTGRES_USER: valarpay
      POSTGRES_PASSWORD: valarpay123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
